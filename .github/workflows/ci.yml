name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-checks:
    name: Backend Lint, Security & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Install Python Dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest-asyncio

      - name: Lint with Ruff
        run: |
          cd backend
          ruff check .

      - name: Run Backend Unit & Security Test Suite
        env:
          DATABASE_URL: sqlite:///./test_dental.db
          JWT_SECRET: test_secret_ci_key_12345678901234567890
          JWT_REFRESH_SECRET: test_refresh_secret_ci_key_12345678901234567890
          ENVIRONMENT: testing
        run: |
          cd backend
          pytest -v

  frontend-checks:
    name: Frontend Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install NPM Dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Type Check
        run: |
          cd frontend
          npm run lint

      - name: Run Frontend Vitest Suite
        run: |
          cd frontend
          npm test

      - name: Build Frontend SPA
        run: |
          cd frontend
          npm run build

  docker-build:
    name: Build Production Docker Images
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: apex-dental-backend:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: apex-dental-frontend:latest
