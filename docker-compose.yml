version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: apex_dental_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: dental_clinic
      MYSQL_USER: dental_user
      MYSQL_PASSWORD: dental_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - dental_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apex_dental_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+mysqldb://dental_user:dental_password@mysql:3306/dental_clinic
      JWT_SECRET: super_secure_production_jwt_secret_key_change_me_immediately_987654321
      JWT_REFRESH_SECRET: super_secure_production_refresh_token_secret_key_change_me_123456789
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      CORS_ORIGINS: "http://localhost,http://localhost:3000,http://127.0.0.1,http://127.0.0.1:3000"
      ENVIRONMENT: production
      STORAGE_LOCAL_DIR: uploads
    volumes:
      - ./backend/uploads:/app/uploads
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - dental_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apex_dental_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - dental_network

volumes:
  mysql_data:

networks:
  dental_network:
    driver: bridge
